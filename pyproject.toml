[project]
name = "critical-minerals"
version = "0.1.0"
description = "Master thesis analysis environment (Comtrade/Eurostat pressure pipeline)"
requires-python = "==3.12.*"
# Pinned to the versions the pipeline ran with before the uv migration
# (Miniconda base + the old ./.conda pip prefix), so results stay reproducible.
dependencies = [
    "formulaic==1.2.2",
    "great-tables==0.21.0",
    "matplotlib==3.10.8",
    "narwhals==2.16.0",
    "numba==0.65.1",
    "numpy==2.2.5",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow>=13.0.0",
    "pyfixest==0.40.1",
    "pymupdf==1.27.2.3",
    "requests>=2.34.2",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
    "tabulate==0.10.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.uv]
package = false
